<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 10 | Math Concepts Practice Lab</title><style>
:root{--purple:#4f2d7f;--gold:#f5b800;--ink:#082d5b;--cream:#fff4cf;--green:#e9f6e6}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f7f7fb;color:#111;line-height:1.45}header{background:var(--purple);color:white;padding:22px 20px;border-bottom:5px solid var(--gold)}header h1{margin:0 0 8px}.wrap{max-width:1100px;margin:auto;padding:24px 20px 40px}.student,.card{background:white;border:2px solid var(--purple);border-radius:14px;padding:24px;margin-bottom:24px}.student{display:grid;grid-template-columns:2fr 1fr;gap:20px}label{font-weight:700}input,select,textarea{width:100%;padding:11px;border:2px solid #bbb;border-radius:8px;font-size:16px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}.tabs button,.nav button,.check,.submit{background:var(--purple);color:white;border:2px solid var(--gold);border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--ink)}.lesson{display:none}.lesson.active{display:block}.lesson h2{margin-top:0;margin-bottom:10px}.lesson>.small{margin-bottom:20px}.q{border-top:1px solid #ddd;padding:24px 0 28px}.q:first-of-type{border-top:0}.q>b{display:block;margin-bottom:14px;font-size:17px}.opts{margin:6px 0 22px}.opts label{display:flex;align-items:flex-start;gap:10px;font-weight:400;padding:8px 6px;line-height:1.4;cursor:pointer}.opts input[type=radio]{width:18px;height:18px;min-width:18px;flex:0 0 18px;margin:2px 0 0 0;padding:0}.q .check{display:block;margin-top:22px}.feedback{font-weight:700;margin-top:12px;line-height:1.4}.good{color:#176b2c}.bad{color:#8b1a1a}.retry{background:var(--cream);color:#111;border-left:5px solid var(--gold);padding:13px 15px;margin:14px 0 18px;line-height:1.45}.codebox{background:var(--purple);color:white;padding:22px;border-radius:12px;border:2px solid var(--gold);margin-top:12px}.codebox h3{margin:0 0 12px}.codebox p{margin:0 0 12px}.codebox textarea{font-family:Consolas,monospace;min-height:170px;background:white;color:#111;margin:4px 0 18px}.codebox .check{display:block;width:100%;margin-top:4px}.codebox .feedback{margin-top:16px;padding:13px 15px;border-radius:9px;background:white;color:#111}.codebox .feedback.good{background:#e9f6e6;color:#176b2c;border:2px solid #78b982}.codebox .feedback.bad{background:#fdeaea;color:#7d1616;border:2px solid #d58b8b}.nav{display:flex;justify-content:space-between;gap:16px;margin-top:28px;padding-top:8px}.final{font-size:22px;font-weight:700;margin:20px 0}.submit{margin-top:12px}.small{font-size:14px;color:#444}@media(max-width:650px){.student{grid-template-columns:1fr}.wrap{padding:16px 12px 30px}.student,.card{padding:18px}.q{padding:22px 0 26px}.opts label{padding:9px 4px}.nav{gap:10px}.nav button{padding:11px 12px}}
</style></head><body><header><h1>Chapter 10 — Math Concepts Practice Lab</h1><div>Libraries • Random Numbers • Math Library • Computer Number Systems</div></header><div class="wrap"><div class="student"><div><label>First and Last Name</label><input id="studentName" placeholder="Enter first and last name"></div><div><label>Class Period</label><select id="period"><option value="">Choose...</option><option>1st Block</option><option>2nd Block</option><option>3rd Block</option><option>4th Block</option></select></div></div><div class="tabs"><button onclick="showLesson(0)" class="active">Lesson 1</button><button onclick="showLesson(1)">Lesson 2</button><button onclick="showLesson(2)">Lesson 3</button><button onclick="showLesson(3)">Lesson 4</button><button onclick="showLesson(4)">Finish</button></div><div id="lessons"></div></div><iframe name="hiddenFrame" style="display:none"></iframe><script>
const lessons=[
{title:'Lesson 1 — Libraries & Documentation',qs:[['A collection of pre-written functions used for common tasks is called a...',['library or module','variable','loop','condition'],0,'A library/module lets programmers reuse existing code.'],['Which Python documentation link leads to detailed descriptions of standard functions?',['FAQs','Library Reference','Downloads','Community'],1,'The Library Reference documents the Python Standard Library.'],['What does API documentation describe?',["A function's name, inputs, outputs, and behavior",'Only the author name','Only installation steps','Only sample output'],0,'API documentation explains how to call and use a function.'],['Why is code reuse helpful?',['It makes every program random','It saves development/testing time','It removes all variables','It prevents input'],1,'Reusing tested functions lets you focus on the unique part of your program.']],code:{prompt:'Write one line that imports the Python math module.',hint:'Use the import keyword followed by the module name.',check:c=>/^import\s+math\s*$/i.test(c.trim())}},
{title:'Lesson 2 — Random Numbers',qs:[['What values can random.randrange(1, 6) return?',['1 through 5','1 through 6','0 through 6','Only 6'],0,'randrange includes the start and excludes the stop value.'],['Why use random.seed(5)?',['To repeat the same pseudo-random sequence','To sort a list','To make a number negative','To import random'],0,'The same seed produces the same sequence.'],['What does random.choice(colors) do?',['Returns one random item','Deletes one item','Sorts the list','Returns every item'],0,'choice() returns one randomly selected element.'],['What does random.shuffle(items) do?',['Returns one item','Reorders a list randomly','Converts a tuple to a list','Rounds values'],1,'shuffle() changes the order of items in a list.']],code:{prompt:'Write code that imports random and stores a random integer from 0 through 9 in a variable named num.',hint:'Remember: randrange(0, 10) can produce 0–9.',check:c=>/import\s+random/i.test(c)&&/num\s*=\s*random\.randrange\(\s*0\s*,\s*10\s*\)/i.test(c)}},
{title:'Lesson 3 — The Math Library',qs:[['What is math.ceil(4.2)?',['4','5','4.2','0'],1,'ceil() rounds upward to the next integer.'],['What is math.floor(5.9)?',['5','6','5.9','0'],0,'floor() rounds downward / drops the fractional part.'],['What is math.fabs(-10)?',['-10.0','10.0','0.0','1.0'],1,'fabs() returns the absolute value.'],['Which is a core function that does NOT require math.?',['math.sqrt()','math.floor()','max()','math.fabs()'],2,'max(), min(), sum(), and round() are core functions.']],code:{prompt:'Write code that imports math, stores 2 raised to the 3rd power in result, and prints result.',hint:'Use math.pow(base, exponent).',check:c=>/import\s+math/i.test(c)&&/result\s*=\s*math\.pow\(\s*2\s*,\s*3\s*\)/i.test(c)&&/print\(\s*result\s*\)/i.test(c)}},
{title:'Lesson 4 — Computer Number Systems',qs:[['A single 0 or 1 in binary is called a...',['byte','bit','float','module'],1,'A bit is one binary digit.'],['What is decimal 4 in binary?',['100','11','10','111'],0,'Using 4-2-1 weights, decimal 4 is binary 100.'],['What decimal value is binary 1101?',['11','12','13','15'],2,'8 + 4 + 1 = 13.'],['What is decimal 15 in binary?',['1010','1111','1100','0111'],1,'8 + 4 + 2 + 1 = 15, so all four bits are 1.']],code:{prompt:'Write Python code that stores the decimal number 13 in a variable named decimal and its binary text "1101" in a variable named binary, then prints both.',hint:'Use decimal = 13 and binary = "1101". Then print both variables.',check:c=>/decimal\s*=\s*13/i.test(c)&&/binary\s*=\s*["']1101["']/i.test(c)&&/print\s*\(/i.test(c)}}];
function shuffleQuestion(q){const correctText=q[1][q[2]];const choices=[...q[1]];for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]]}return [q[0],choices,choices.indexOf(correctText),q[3]]}lessons.forEach(L=>L.qs=L.qs.map(shuffleQuestion));let scores=Array(4).fill(0).map(()=>({mc:[false,false,false,false],code:false}));
function build(){const root=document.getElementById('lessons');lessons.forEach((L,li)=>{let d=document.createElement('section');d.className='lesson card'+(li===0?' active':'');d.innerHTML=`<h2>${L.title}</h2><p class="small">Each question is worth 5 points. Answer choices are randomized each time the lab is opened. You may correct an answer and check again.</p>`;L.qs.forEach((q,qi)=>{let x=document.createElement('div');x.className='q';x.innerHTML=`<b>${qi+1}. ${q[0]}</b><div class="opts">${q[1].map((o,oi)=>`<label><input type="radio" name="q${li}_${qi}" value="${oi}"><span>${o}</span></label>`).join('')}</div><button class="check" onclick="checkMC(${li},${qi})">Check Answer</button><div id="f${li}_${qi}" class="feedback"></div>`;d.appendChild(x)});let c=document.createElement('div');c.className='codebox';c.innerHTML=`<h3>Coding Check — 5 points</h3><p>${L.code.prompt}</p><div class="retry"><b>Retry allowed:</b> If your code is not correct, fix it in the box and click Check My Code again.</div><textarea id="code${li}" placeholder="Type your complete Python code here..."></textarea><button class="check" onclick="checkCode(${li})">Check My Code</button><div id="cf${li}" class="feedback"></div>`;d.appendChild(c);const leftButton=li===0?`<button onclick="startOver()">↻ Start Over</button>`:`<button onclick="showLesson(${li-1})">← Previous Lesson</button>`;d.innerHTML+=`<div class="nav">${leftButton}<button onclick="showLesson(${li+1})">Next Lesson →</button></div>`;root.appendChild(d)});let f=document.createElement('section');f.className='lesson card';f.innerHTML=`<h2>Finish & Submit</h2><p>Complete all four lesson tabs before submitting.</p><div class="final">Points: <span id="pts">0</span>/100 &nbsp; | &nbsp; Grade: <span id="grade">0%</span></div><p id="submitMsg"></p><button class="submit" onclick="submitWork()">Submit My Work</button><div class="nav"><button onclick="showLesson(3)">← Previous Lesson</button><span></span></div>`;root.appendChild(f)}
function startOver(){window.scrollTo(0,0);location.reload()}function checkMC(li,qi){let a=document.querySelector(`input[name=q${li}_${qi}]:checked`),f=document.getElementById(`f${li}_${qi}`);if(!a){f.className='feedback bad';f.textContent='Choose an answer first.';return}let ok=+a.value===lessons[li].qs[qi][2];scores[li].mc[qi]=ok;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ Correct! ':'✗ Not quite. ')+lessons[li].qs[qi][3]+(ok?'':' Change your answer and try again.');update()}function checkCode(li){let c=document.getElementById('code'+li).value,f=document.getElementById('cf'+li),ok=lessons[li].code.check(c);scores[li].code=ok;f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✓ Code check passed!':'✗ Not quite. '+lessons[li].code.hint+' Fix your code above and check again.';update()}function total(){return scores.reduce((s,L)=>s+L.mc.filter(Boolean).length*5+(L.code?5:0),0)}function update(){let p=total();document.getElementById('pts').textContent=p;document.getElementById('grade').textContent=p+'%'}function showLesson(n){if(n<0)n=0;if(n>4)n=4;document.querySelectorAll('.lesson').forEach((e,i)=>e.classList.toggle('active',i===n));document.querySelectorAll('.tabs button').forEach((e,i)=>e.classList.toggle('active',i===n));if(n===4)update();window.scrollTo({top:0,behavior:'smooth'})}
function submitWork(){let name=document.getElementById('studentName').value.trim(),period=document.getElementById('period').value;if(!name||!period){document.getElementById('submitMsg').textContent='Enter your first and last name and class period before submitting.';return}let grade=total()+'%';let form=document.createElement('form');form.method='POST';form.action='https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse';form.target='hiddenFrame';let data={'entry.2089413779':name,'entry.890934651':period,'entry.646173439':'Chapter 10 | Math Concepts','entry.962158861':grade};Object.entries(data).forEach(([k,v])=>{let i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)});document.body.appendChild(form);form.submit();form.remove();document.getElementById('submitMsg').innerHTML=`<b>Submitted!</b> ${name} — ${period} — Grade: ${grade}`}
build();
</script></body></html>
